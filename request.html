<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на услуги - FitEnergy</title>
    <link rel="stylesheet" href="request.css">
</head>
<body>
    <header>
        <div class="logo">FitEnergy</div>
        <p>Студия фитнеса</p>
    </header>
    
    <nav>
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="login.html">Вход</a></li>
            <li><a href="register.html">Регистрация</a></li>
            <li><a href="request.html">Заявка</a></li>
        </ul>
    </nav>
    
    <div class="request-container">
        <h2>Заявка на услуги</h2>
        <form action="index.html" method="get">
            <div class="form-group">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="service">Услуга</label>
                <select id="service" required>
                    <option value="">Выберите услугу</option>
                    <option value="personal">Персональные тренировки</option>
                    <option value="group">Групповые занятия</option>
                    <option value="yoga">Йога</option>
                    <option value="crossfit">Кроссфит</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Желаемая дата</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="message">Дополнительная информация</label>
                <textarea id="message"></textarea>
            </div>
            <button type="submit" class="btn">Отправить заявку</button>
        </form>
    </div>
    
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Контакты</h3>
                <p><i class="fas fa-map-marker-alt"></i> г. Барнаул, ул. Балтийская, 15</p>
            </div>
            <div class="footer-section">
                <h3>Телефон</h3>
                <p><i class="fas fa-phone"></i> +7 (123) 456-78-90</p>
            </div>
            <div class="footer-section">
                <h3>Email</h3>
                <p><i class="fas fa-envelope"></i> info@fitenergy.ru</p>
            </div>
            <div class="footer-section">
                <h3>Соцсети</h3>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-vk"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-telegram"></i></a>
                </div>
            </div>
        </div>
        <div class="copyright">
            <p>&copy; 2025 FitEnergy. Все права защищены.</p>
        </div>
    </footer>
</body>
</html>
