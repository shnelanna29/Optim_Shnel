<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - FitEnergy</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <header>
        <div class="logo">FitEnergy</div>
        <p>Студия фитнеса</p>
    </header>
    
    <nav>
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="login.html">Вход</a></li>
            <li><a href="register.html">Регистрация</a></li>
            <li><a href="request.html">Заявка</a></li>
        </ul>
    </nav>
    
    <div class="register-container">
        <h2>Регистрация</h2>
        <form action="login.html" method="get">
            <div class="form-group">
                <label for="name">Имя</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Подтвердите пароль</label>
                <input type="password" id="confirmPassword" required>
            </div>
            <button type="submit" class="btn">Зарегистрироваться</button>
        </form>
        <div class="login-link">
            <p>Уже есть аккаунт? <a href="login.html">Войдите</a></p>
        </div>
    </div>
    
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Контакты</h3>
                <p><i class="fas fa-map-marker-alt"></i> г. Барнаул, ул. Балтийская, 15</p>
            </div>
            <div class="footer-section">
                <h3>Телефон</h3>
                <p><i class="fas fa-phone"></i> +7 (123) 456-78-90</p>
            </div>
            <div class="footer-section">
                <h3>Email</h3>
                <p><i class="fas fa-envelope"></i> info@fitenergy.ru</p>
            </div>
            <div class="footer-section">
                <h3>Соцсети</h3>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-vk"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-telegram"></i></a>
                </div>
            </div>
        </div>
        <div class="copyright">
            <p>&copy; 2025 FitEnergy. Все права защищены.</p>
        </div>
    </footer>
</body>
</html>
